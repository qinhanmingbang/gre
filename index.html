*{box-sizing:border-box}html{font-size:calc(16px*var(--fs,1))}
body{margin:0;background:var(--bg);color:var(--t);font:1rem/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;transition:background .3s}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.4rem;margin:8px 0 2px}.sub{color:var(--m);font-size:.82rem;margin-bottom:10px}small{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}.card.r{position:relative}
.q{font-size:1.75rem;font-weight:700;text-align:center;padding:12px 4px;word-break:break-word}
button{font:inherit;color:inherit;cursor:pointer}
.btn,.opt{display:block;width:100%;text-align:left;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin:8px 0}
.btn.p{background:var(--p);color:#fff;border-color:var(--p);text-align:center;font-weight:600}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.ghost{background:none;border:1px solid var(--b);border-radius:8px;padding:4px 10px;color:var(--m)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:.88rem}
.bar{height:6px;background:var(--b);border-radius:3px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--p)}
.star{position:absolute;right:8px;top:4px;background:none;border:0;font-size:1.5rem;color:#d9971a}
.row{display:flex;gap:8px}.row>*{flex:1}.row .btn,.g2 .btn{text-align:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);max-width:100%}.row select{width:100%}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}.li:last-child{border:0}
.big{font-size:2.6rem;font-weight:800;text-align:center;color:var(--p)}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center;font-size:.82rem;color:var(--m)}.g b{display:block;font-size:1.3rem;color:var(--t)}
.pb{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--p)}

/* 霓虹主题、学习进度和炫酷倒计时 */
body{background-image:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--p) 14%,transparent),transparent 48%)}
.card,.btn,.opt,.g div{box-shadow:0 5px 18px #0000000a;transition:transform .18s,box-shadow .18s,background .25s}
.btn:active,.opt:active{transform:scale(.985)}
.btn.p{box-shadow:0 5px 20px color-mix(in srgb,var(--p) 28%,transparent)}
.progress-card{overflow:hidden;position:relative}
.progress-card:after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--p);box-shadow:0 0 14px var(--p)}
.mastery-line{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;color:var(--m);margin-top:10px}
.mastery-line b{color:var(--t)}
.mastery-bar{height:10px;background:color-mix(in srgb,var(--b) 75%,transparent);border-radius:99px;overflow:hidden;margin-top:8px}
.mastery-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--ok));box-shadow:0 0 12px color-mix(in srgb,var(--p) 60%,transparent);transition:width .5s ease}
.timer-wrap{display:flex;justify-content:center;align-items:center;padding:8px 0 12px}
.timer-ring{--progress:100%;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--timer-color,var(--p)) var(--progress),color-mix(in srgb,var(--b) 30%,transparent) 0);box-shadow:0 0 22px color-mix(in srgb,var(--timer-color,var(--p)) 28%,transparent);transition:filter .2s}
.timer-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--c);border:1px solid var(--b)}
.timer-center{position:relative;z-index:1;text-align:center;line-height:1.1}
.timer-num{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer-label{font-size:.62rem;letter-spacing:1px;color:var(--m);margin-top:4px}
.timer-ring.urgent{--timer-color:var(--no)!important;animation:timerPulse .55s infinite alternate;filter:saturate(1.5)}
.timer-ring.urgent .timer-num{color:var(--no)}
@keyframes timerPulse{from{transform:scale(1);box-shadow:0 0 10px color-mix(in srgb,var(--no) 20%,transparent)}to{transform:scale(1.055);box-shadow:0 0 30px color-mix(in srgb,var(--no) 55%,transparent)}}

function pick(k){if(locked)return;locked=true;clearTimeout(tm);clearInterval(clock);const q=qs[qi],ok=k==q.a,id=q.x.id,bs=document.querySelectorAll('.opt'),d=ds(Date.now());
 bs[q.a].classList.add('ok');if(k>=0&&!ok)bs[k].classList.add('no');
 S.ans++;S.days[d]=(S.days[d]||0)+1;if(mode=='test'||mode=='listen'||mode=='free'){S.rec.push(ok?1:0);S.rec=S.rec.slice(-200)}
 if(ok){S.ok++;nok++;sfx.ok();S.mastered[id]=1;delete S.wrong[id]}
 else{sfx.no();delete S.mastered[id];S.wrong[id]={s:0,t:Date.now()};if(!wl.some(x=>x.id===id))wl.push(q.x)}
 save();if(!q.en&&S.auto)setTimeout(()=>say(q.x.w),ok?350:500);
 if(ok)nt=setTimeout(next,650);
 else document.getElementById('fb').innerHTML=`<div class=card>${k<0?'⏰ 时间到！　':''}<b>${esc(q.x.w)}</b>${q.x.p?` <small style="font-size:.95em">/${esc(q.x.p)}/</small>`:''}　${esc(q.x.m)}<div class=sub style="margin-top:6px">已加入错题队列；答对后就不会再出现在普通测验中。</div></div><button class="btn p" onclick=next()>记住释义，下一题（回车）</button>`}
function next(){clearTimeout(nt);qi++;showQ()}
function finish(){clearInterval(clock);clearTimeout(tm);endSes();const n=qs.length,pct=Math.round(nok*100/n),c=CM[[100,90,80,70,60,50,40,30,20,0].findIndex(t=>pct>=t)];
 S.hist.push({d:Date.now(),s:pct,n,m:mode,e:c[0]});S.hist=S.hist.slice(-50);save();sfx.fin(pct);
 const e=(mode=='test'||mode=='listen'||mode=='free')?est(qs.map((_,i)=>i<nok?1:0)):null;
 $.innerHTML=`<div class=big>${c[0]}</div><h1 style="text-align:center">${c[1]}</h1><div class=big>${pct}<small style="font-size:1rem"> / 100</small></div><div class=sub style="text-align:center">答对 ${nok} / ${n}</div>
 <div class=card>${c[2]}</div>${e?`<div class=card>📊 按本套正确率（已扣除蒙对的 25%）推算，词库掌握量约 <b>${rd(e[0]*W.length)}</b> / ${W.length} 词。<br><small>单套样本小、误差大，累计估算见「统计」。</small></div>`:''}
 ${wl.length?`<div class=card><b>本套错词（已加入错题本）</b>${wl.map(x=>`<div class=li><span><b>${esc(x.w)}</b>${x.p?` <small style="font-size:.9em">/${esc(x.p)}/</small>`:''} <small>${esc(x.m)}</small></span><button class=ghost data-i="${esc(x.id)}" onclick="sayId(this.dataset.i)">🔊</button></div>`).join('')}</div>`:''}
 ${brk()}<button class="btn p" onclick="start('${mode}')">再来一套</button><button class=btn onclick=home()>返回首页</button>`}
function fcard(r){const q=qs[qi];if(!q){endSes();return home()}
 $.innerHTML=`<div class=top><span>${qi+1}/${qs.length}</span><span>词卡浏览</span><button class=ghost onclick=home()>退出</button></div>
 <div class="card r" id=fc onclick="fcard(1)" style="min-height:170px"><div class=q>${esc(q.x.w)}</div>${q.x.p?`<div class=sub style="text-align:center;font-size:1.15rem;margin-top:4px">/${esc(q.x.p)}/</div>`:''}${r?`<div class=q style="font-size:1.25rem">${esc(q.x.m)}</div>`:'<div class=sub style="text-align:center">点击卡片查看释义</div>'}<button class=star onclick="event.stopPropagation();fav()">${S.fav[q.x.id]?'★':'☆'}</button></div>
 <div style="text-align:center"><button class=ghost onclick="say(qs[qi].x.w)">🔊 重听</button></div><div class=row><button class=btn onclick="fk(0)">不认识</button><button class="btn p" onclick="fk(1)">认识</button></div>`;
 if(!r&&S.auto)setTimeout(()=>say(q.x.w),150)}
function fk(k){const x=qs[qi].x,d=ds(Date.now());S.days[d]=(S.days[d]||0)+1;if(!k&&!S.wrong[x.id])S.wrong[x.id]={s:0,t:Date.now()+DAY};save();qi++;fcard(0)}
document.addEventListener('keydown',e=>{if(!document.getElementById('qc')||e.target.tagName=='SELECT')return;const k=e.key.toLowerCase();
 if(k.length==1&&'1234'.includes(k))pick(+k-1);else if(k.length==1&&'abcd'.includes(k))pick('abcd'.indexOf(k));else if(k=='enter'||k==' '){e.preventDefault();if(locked)next()}else if(k=='r')say(qs[qi].x.w)});
function list(t){const ids=Object.keys(t=='wrong'?S.wrong:S.fav).filter(i=>M[i]);
 $.innerHTML=`<div class=top><button class=ghost onclick=home()>← 返回</button><span>${t=='wrong'?'错题本':'收藏词本'}（${ids.length}）</span></div><div class=card>${ids.length?ids.map(i=>{const x=M[i],e=S.wrong[i];
 return`<div class=li><span><b>${esc(x.w)}</b>${x.p?` <small style="font-size:.9em">/${esc(x.p)}/</small>`:''}<br><small>${esc(x.m)}${t=='wrong'?` · 阶段${e.s+1}/${IV.length} · ${e.t<=Date.now()?'已到期':new Date(e.t).toLocaleDateString()}`:''}</small></span><span><button class=ghost data-i="${esc(i)}" onclick="sayId(this.dataset.i)">🔊</button> <button class=ghost data-i="${esc(i)}" onclick="del('${t}',this.dataset.i)">移除</button></span></div>`}).join(''):'<div class=sub>空空如也</div>'}</div>`}
function del(t,i){delete(t=='wrong'?S.wrong:S.fav)[i];save();list(t)}
function stats(){const h=S.hist.slice(-10).reverse(),a=S.ans?Math.round(S.ok/S.ans*100):0,td=ds(Date.now()),tt=Object.values(S.tm).reduce((x,y)=>x+y,0),r=S.rec.length>=20?est(S.rec):null,done=masteredCount(),left=W.length-done;
 $.innerHTML=`<div class=top><button class=ghost onclick=home()>← 返回</button><span>统计</span></div><div class=g style="margin-top:10px"><div><b>${S.ans}</b>累计答题</div><div><b>${a}%</b>总正确率</div><div><b>${done}</b>已掌握词</div><div><b>${left}</b>未掌握词</div><div><b>${Object.keys(S.wrong).length}</b>错题本</div><div><b>${due().length}</b>今日待复习</div><div><b>${streak()} 天</b>连续学习</div><div><b>${mins(S.tm[td]||0)} 分</b>今日用时（累计 ${mins(tt)} 分）</div></div>
 <div class=card><b>📊 预估词库掌握量</b><br>${r?`约 <b>${rd(r[0]*W.length)}</b> / ${W.length} 词（${Math.round(r[0]*100)}%）<br><small>依据最近 ${r[3]} 道测验题，已扣除蒙对的 25%；95% 区间 ${rd(r[1]*W.length)}–${rd(r[2]*W.length)}。答得越多越准。</small>`:`<small>测验、听音、复习模式累计答满 20 题后显示（目前 ${S.rec.length} 题）。</small>`}</div>
 <div class=card><b>最近 ${h.length} 套</b>${h.map(x=>`<div class=li><span>${x.e||''} ${new Date(x.d).toLocaleString()}</span><small>${x.s} 分</small></div>`).join('')||'<div class=sub>暂无记录</div>'}</div>`}
const sel=(k,l,o)=>`<div class=li><span>${l}</span><select onchange="S['${k}']=isNaN(this.value)?this.value:+this.value;save();apply()">${o.map(([v,t])=>`<option value="${v}" ${S[k]==v?'selected':''}>${t}</option>`).join('')}</select></div>`;
function sets(){$.innerHTML=`<div class=top><button class=ghost onclick=home()>← 返回</button><span>设置</span></div><div class=card>
 ${sel('theme','界面主题',TH)}${sel('fs','字号',[[0.9,'小'],[1,'标准'],[1.15,'大'],[1.3,'特大']])}${sel('lim','单题限时',[[4000,'4 秒'],[6000,'6 秒'],[8000,'8 秒'],[10000,'10 秒'],[15000,'15 秒'],[0,'不限时']])}
 ${sel('n','每套题数',[[10,'10'],[20,'20'],[30,'30'],[50,'50']])}${sel('goal','每日目标（题）',[[30,'30'],[60,'60'],[100,'100'],[200,'200']])}
 ${sel('acc','发音',[['en-US','美音'],['en-GB','英音']])}${sel('rate','语速',[[0.7,'慢'],[0.9,'正常偏慢'],[1,'正常'],[1.15,'快']])}${sel('auto','自动朗读英文',[[1,'开'],[0,'关']])}${sel('snd','答题音效',[[1,'开'],[0,'关']])}
 <div class=li><span>试听发音与音效</span><span><button class=ghost onclick="say('vocabulary')">🔊</button> <button class=ghost onclick="sfx.ok()">✔</button> <button class=ghost onclick="sfx.no()">✘</button></span></div></div>
 <button class=btn onclick=expo()>导出学习进度（JSON）</button><button class=btn onclick="pickFile('prog')">导入学习进度</button><button class=btn onclick="pickFile('vocab')">导入自定义词库（txt/csv/json）</button>
 ${S.custom?'<button class=btn onclick="S.custom=null;save();load();home()">恢复内置词库</button>':''}
 <button class=btn style="color:var(--no)" onclick="if(confirm('清空所有学习进度？（设置和词库保留）')){['wrong','mastered','fav','hist','ans','ok','days','tm','rec'].forEach(k=>S[k]=JSON.parse(JSON.stringify(def[k])));save();home()}">清空进度</button>
 <div class=sub>规则：普通测验只抽取未掌握词和错词；答对即掌握并永久移出普通测验，答错会进入错题队列。词库格式：每行「单词,释义」或「单词⇥释义」；也支持 [["word","释义"],…] 的 JSON。朗读使用系统自带的英文语音，无需联网。</div>`}
function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='单词记忆进度.json';a.click()}
function pickFile(t){const f=document.createElement('input');f.type='file';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{
 if(t=='prog'){Object.assign(S,JSON.parse(r.result))}else{let a;const s=r.result.trim();
  if(s[0]=='['){a=JSON.parse(s).map(x=>Array.isArray(x)?[x[0],x[1],0]:[x.w||x.word,x.m||x.meaning,0])}
  else a=s.split(/\r?\n/).map(l=>{const m=l.match(/^(.+?)(?:\t|,| \| )(.+)$/);return m?[m[1].trim(),m[2].trim().replace(/^"|"$/g,''),0]:null}).filter(Boolean);
  if(a.length<4)throw 0;S.custom=a}
 save();load();apply();alert('导入成功');home()}catch(e){alert('文件格式不对')}};r.readAsText(f.files[0])};f.click()}
home();
</script></body></html>
